- title: "Accelerating Inference of Masked Image Generators via Reinforcement Learning"
  authors:
    - Pranav Subbaraman
    - Shufan Li
    - Siyan Zhao
    - Aditya Grover
  date: "Nov 30, 2025"
  category: "cs.CV"
  summary: "Masked Generative Models (MGMs) demonstrate strong capabilities in generating high-fidelity images. However, they need many sampling steps to create high-quality generations, resulting in slow inference speed. In this work, we propose Speed-RL, a novel paradigm for accelerating a pretrained MGMs to generate high-quality images in fewer steps. Unlike conventional distillation methods which formulate the acceleration problem as a distribution matching problem, where a few-step student model is trained to match the distribution generated by a many-step teacher model, we consider this problem as a reinforcement learning problem. Since the goal of acceleration is to generate high quality images in fewer steps, we can combine a quality reward with a speed reward and finetune the base model using reinforcement learning with the combined reward as the optimization target. Through extensive experiments, we show that the proposed method was able to accelerate the base model by a factor of 3x while maintaining comparable image quality."
  link: "https://arxiv.org/abs/2511.18191"

- title: "Accelerating Time Series Foundation Models with Speculative Decoding"
  authors:
    - Pranav Subbaraman
    - Fang Sun
    - Jinxi Yu
    - Yue Yao
    - Huacong Tang
    - Xiao Luo
    - Yizhou Sun
  date: "Nov 22, 2025"
  category: "cs.LG"
  summary: "Time series forecasting drives operational decisions under tight latency budgets, and autoregressive time series foundation models (TSFMs) increasingly deliver the most accurate forecasts. That accuracy is paid for at inference, since a horizon of H steps takes ⌈H/P⌉ sequential forward passes of a large model, so latency grows with exactly the long horizons these models are prized for. Yet a far cheaper model predicts most next patches nearly as well as the large one, and causal models can verify a block of future patches in one parallel pass even though they generate them one at a time. These are precisely the conditions under which speculative decoding thrives in LLMs, but its ingredients are all defined over discrete vocabularies. We therefore develop speculative decoding for continuous patch autoregression. A cheap draft proposes K future patches, and the target verifies all of them in a single causal pass, accepting each by a log-domain Gaussian likelihood-ratio test and correcting the first rejection with its own prediction. We prove that the accelerated output stays within a squared-error radius of target-only decoding set by an acceptance temperature, and that throughput follows a capped-geometric law that makes speedups predictable before deployment. The method delivers up to 3.0× inference speedup at accuracy between target and draft across five TSFM families, and we characterize which architectures admit single-pass verification and when speculation does not pay."
  link: "https://arxiv.org/abs/2512.01094"

